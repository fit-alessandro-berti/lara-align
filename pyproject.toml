[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lara-align"
version = "0.1.0"
description = "Learned Adaptive Recombined Alignments for Petri-net conformance checking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = [
    "pm4py>=2.7",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["lara_align*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
