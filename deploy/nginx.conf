map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lara_streamlit {
    server streamlit:8501;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Must be at least Streamlit's configured maximum upload size.
    client_max_body_size 1024m;

    location = /healthz {
        access_log off;
        proxy_pass http://lara_streamlit/_stcore/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass http://lara_streamlit;
        proxy_http_version 1.1;

        # Streamlit uses WebSockets for each interactive browser session.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
